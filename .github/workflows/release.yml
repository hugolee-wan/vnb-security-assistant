name: Cross-Platform Build (macOS / Windows / Linux)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (Apple Silicon · GPUI Metal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS bundle
        run: |
          chmod +x platforms/macos/build_macos.sh
          ./platforms/macos/build_macos.sh
      - name: Verify ABI & headless check
        run: |
          ./platforms/macos/vnb-security-assistant --abi-info
          ./platforms/macos/vnb-security-assistant --headless-check > macos_report.json
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnb-edr-macos-arm64
          path: |
            platforms/macos/
            models/
            edr_model_config.json
            LICENSE
            README.md

  build-windows:
    name: Windows (x86_64 · Win32 + egui)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows release
        shell: pwsh
        run: ./platforms/windows/build_windows.ps1
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnb-edr-windows-x86_64
          path: |
            platforms/windows/
            models/
            edr_model_config.json
            LICENSE
            README.md

  build-linux:
    name: Linux (x86_64 · /proc + egui)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI & system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux release
        run: |
          chmod +x platforms/linux/build_linux.sh platforms/linux/start_linux_edr.sh
          ./platforms/linux/build_linux.sh
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnb-edr-linux-x86_64
          path: |
            platforms/linux/
            models/
            edr_model_config.json
            LICENSE
            README.md
